name: ubuntu24

on:
  push:
    branches:
      - 0.6.9   # Added for consistency, optional
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: install-deps
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential libtool autotools-dev automake pkg-config \
          bsdmainutils python3 python3-pip \
          libssl-dev libevent-dev libboost-all-dev \
          libzmq3-dev libdb_cxx_compat-dev \
          libminiupnpc-dev libnatpmp-dev libqrencode-dev

    - name: build
      run: |
        set -e
        chmod +x ./autogen.sh
        ./autogen.sh
        ./configure --without-gui --disable-tests
        make -j$(nproc)
