name: ubuntu24

on:
  push:
    branches:
      - 0.6.8
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: install-deps
      run: |
        # Removed add-apt-repository ppa:bitcoin/bitcoin as it's not needed for libdb_cxx_compat-dev or other packages on Ubuntu 24.04
        sudo apt-get update
        sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3
        sudo apt-get install -y libssl-dev libevent-dev libboost-all-dev
        sudo apt-get install -y libzmq3-dev
        # Replaced libdb4.8-dev libdb4.8++-dev with libdb_cxx_compat-dev for compatibility with older Berkeley DB versions
        sudo apt-get install -y libdb_cxx_compat-dev
        sudo apt-get install -y libminiupnpc-dev libnatpmp-dev
        sudo apt-get install -y libqrencode-dev

    - name: build
      run: |
        ./autogen.sh
        ./configure --without-gui --disable-tests
        make
