name: Ubuntu 24.04 Build

on:
  push:
    branches: [ "0.6.9" ]
  pull_request:
    branches: [ "0.6.9" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libtool autotools-dev automake pkg-config \
          libssl-dev libboost-all-dev libevent-dev python3 \
          qtbase5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler \
          libqrencode-dev libminiupnpc-dev libzmq3-dev wget

    - name: Build Berkeley DB 4.8
      run: |
        git clone https://github.com/SpaceXpanse/rod-core-wallet
        cd rod-core-wallet 
        chmod +x ./contrib/install_db4.sh
        ./contrib/install_db4.sh `pwd`  
        export BDB_PREFIX='$PWD/db4'

    - name: Build rod-core-wallet
      env:
        BDB_PREFIX: $HOME/db4
      run: |
        ./autogen.sh
        ./configure \
          --without-gui \
          --disable-tests \ 
          --without-miniupnpc \
          BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8" \
          BDB_CFLAGS="-I$BDB_PREFIX/include"
        make -j"$(($(nproc)-1))"
