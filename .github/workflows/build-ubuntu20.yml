name: Build ROD core wallets

on:
  push:
    branches:
      - '**/issue*'
      - dev
      - '[0-9].[0-9].[0-9]+'
    tags:
      - build
      - 'v[0-9].[0-9].[0-9]+'
  pull_request:
    branches:
      - dev

jobs:
  linux64:
    name: Ubuntu wallet build
    runs-on: ubuntu-20.04
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: ${{ github.workspace }}/build-artifacts/linux64
      ARTIFACT_NAME: spacexpanse-${{ github.ref_name }}.${{ github.run_number }}-linux64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            autotools-dev \
            automake \
            pkg-config \
            libssl-dev \
            libevent-dev \
            bsdmainutils \
            python3 \
            libminiupnpc-dev \
            libnatpmp-dev \
            libzmq3-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-chrono-dev \
            libboost-test-dev \
            libboost-thread-dev \
            libsqlite3-dev \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libprotobuf-dev \
            protobuf-compiler \
            libqrencode-dev \
            zip

      - name: Install Berkeley DB 4.8
        run: |
          chmod +x ./contrib/install_db4.sh
          ./contrib/install_db4.sh "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          ./autogen.sh
          ./configure \
            BDB_LIBS="-L$GITHUB_WORKSPACE/db4/lib -ldb_cxx-4.8" \
            BDB_CFLAGS="-I$GITHUB_WORKSPACE/db4/include"

      - name: Build
        run: make -j"$(nproc)"

      - name: Package binaries
        run: |
          mkdir -p "$BUILD_DIR"
          cp src/spacexpansed "$BUILD_DIR/"
          cp src/spacexpanse-cli "$BUILD_DIR/"
          cp src/spacexpanse-tx "$BUILD_DIR/"
          cp src/spacexpanse-wallet "$BUILD_DIR/"
          cp src/spacexpanse-util "$BUILD_DIR/"
          cp src/qt/spacexpanse-qt "$BUILD_DIR/"
          strip "$BUILD_DIR"/* || true
          (cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

  win64:
    name: Windows wallet build
    runs-on: ubuntu-20.04
    defaults:
      run:
        shell: bash
    env:
      HOST: x86_64-w64-mingw32
      BUILD_DIR: ${{ github.workspace }}/build-artifacts/win64
      ARTIFACT_NAME: spacexpanse-${{ github.ref_name }}.${{ github.run_number }}-win64
      CONFIG_SITE: ${{ github.workspace }}/depends/x86_64-w64-mingw32/share/config.site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sdk-sources
            depends/work/build
            depends/x86_64-w64-mingw32
          key: ${{ runner.os }}-depends-${{ env.HOST }}-${{ hashFiles('depends/packages/*', 'depends/packages/**/*.mk', 'depends/hosts/**', '.github/workflows/build-ubuntu20.yml') }}
          restore-keys: |
            ${{ runner.os }}-depends-${{ env.HOST }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            autotools-dev \
            automake \
            pkg-config \
            libssl-dev \
            libevent-dev \
            bsdmainutils \
            python3 \
            libminiupnpc-dev \
            libnatpmp-dev \
            libzmq3-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-chrono-dev \
            libboost-test-dev \
            libboost-thread-dev \
            g++-mingw-w64-x86-64-posix \
            nsis \
            zip

      - name: Build depends
        env:
          LC_ALL: C.UTF-8
        run: |
          unset CC CXX DISPLAY
          PATH="$(echo "$PATH" | sed -e 's/:\/mnt.*//g')"
          make -j"$(nproc)" -C depends HOST="$HOST"

      - name: Configure
        env:
          LC_ALL: C.UTF-8
        run: |
          ./autogen.sh
          ./configure \
            --prefix=/ \
            --host="$HOST" \
            --with-gui=yes \
            --disable-gui-tests \
            --disable-external-signer \
            LDFLAGS=-Wa,-mbig-obj

      - name: Build
        env:
          LC_ALL: C.UTF-8
        run: make -j"$(nproc)"

      - name: Package binaries
        run: |
          mkdir -p "$BUILD_DIR"
          cp src/spacexpansed.exe "$BUILD_DIR/"
          cp src/spacexpanse-cli.exe "$BUILD_DIR/"
          cp src/spacexpanse-tx.exe "$BUILD_DIR/"
          cp src/spacexpanse-wallet.exe "$BUILD_DIR/"
          cp src/spacexpanse-util.exe "$BUILD_DIR/"
          cp src/qt/spacexpanse-qt.exe "$BUILD_DIR/"
          find . -maxdepth 1 -type f -name 'spacexpanse-*-win64-setup.exe' -exec cp {} "$BUILD_DIR/" \;
          x86_64-w64-mingw32-strip "$BUILD_DIR"/*.exe || true
          (cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

  macos:
    name: macOS wallet build
    runs-on: macos-13
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: ${{ github.workspace }}/build-artifacts/macos
      ARTIFACT_NAME: spacexpanse-${{ github.ref_name }}.${{ github.run_number }}-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Berkeley DB 4.8
        uses: actions/cache@v4
        with:
          path: db4
          key: ${{ runner.os }}-db4-${{ hashFiles('contrib/install_db4.sh') }}

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            autoconf \
            automake \
            boost \
            coreutils \
            libevent \
            libnatpmp \
            miniupnpc \
            pkg-config \
            protobuf \
            qrencode \
            qt@5 \
            zeromq \
            zip

      - name: Install Berkeley DB 4.8
        run: |
          chmod +x ./contrib/install_db4.sh
          ./contrib/install_db4.sh "$GITHUB_WORKSPACE"

      - name: Configure environment
        run: |
          echo "QT_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "BDB_PREFIX=$GITHUB_WORKSPACE/db4" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$(brew --prefix zeromq)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix qt@5)/bin:/usr/local/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ./autogen.sh
          ./configure \
            BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8" \
            BDB_CFLAGS="-I$BDB_PREFIX/include" \
            CPPFLAGS="-I$QT_PATH/include" \
            LDFLAGS="-L$QT_PATH/lib"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package binaries
        run: |
          mkdir -p "$BUILD_DIR"
          cp src/spacexpansed "$BUILD_DIR/"
          cp src/spacexpanse-cli "$BUILD_DIR/"
          cp src/spacexpanse-tx "$BUILD_DIR/"
          cp src/spacexpanse-wallet "$BUILD_DIR/"
          cp src/spacexpanse-util "$BUILD_DIR/"
          cp src/qt/spacexpanse-qt "$BUILD_DIR/"
          if [ -d src/qt/SpaceXpanse-Qt.app ]; then
            cp -R src/qt/SpaceXpanse-Qt.app "$BUILD_DIR/"
          fi
          (cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
