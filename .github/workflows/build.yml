  # Windows Build (MinGW)
  windows-build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: |
          make
          mingw64/mingw-w64-x86_64-gcc
          mingw64/mingw-w64-x86_64-make
          autoconf
          automake
          libtool
          pkg-config
          mingw64/mingw-w64-x86_64-curl
          mingw64/mingw-w64-x86_64-jansson
          mingw64/mingw-w64-x86_64-ncurses
          git

    - name: Autogen
      shell: msys2 {0}
      run: |
        ./autogen.sh

    - name: Configure
      shell: msys2 {0}
      run: |
        ./configure --enable-neoscrypt-xaya --without-curses LDFLAGS="-L/mingw64/lib" CPPFLAGS="-I/mingw64/include"

    - name: Build
      shell: msys2 {0}
      run: |
        make -j$NUMBER_OF_PROCESSORS

    - name: Verify binary
      shell: msys2 {0}
      run: |
        ls -la nsgminer.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-windows
        path: nsgminer.exe
        retention-days: 7

  # macOS Build
  macos-build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install autoconf automake libtool pkg-config curl jansson ncurses uthash yasm libgcrypt libgpg-error git

    - name: Configure pkg-config paths
      run: |
        echo "PKG_CONFIG_PATH=$(brew --prefix libgpg-error)/lib/pkgconfig:$(brew --prefix libgcrypt)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Autogen
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        CPPFLAGS="-I$(brew --prefix libgpg-error)/include -I$(brew --prefix libgcrypt)/include" \
        LDFLAGS="-L$(brew --prefix libgpg-error)/lib -L$(brew --prefix libgcrypt)/lib" \
        ./configure --enable-neoscrypt-xaya --without-curses

    - name: Build
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Verify binary
      run: |
        ls -la nsgminer
        file nsgminer
        ./nsgminer --version 2>&1 || echo "Version check completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-macos
        path: nsgminer
        retention-days: 7

  # Verification test
  verify-algorithms:
    runs-on: ubuntu-latest
    needs: linux-standard
    steps:
    - name: Download Linux Standard binary
      uses: actions/download-artifact@v4
      with:
        name: nsgminer-linux-standard
        path: .

    - name: Make executable and verify
      run: |
        chmod +x nsgminer
        ls -la nsgminer
        file nsgminer
        
    - name: Check for neoscrypt-xaya support
      run: |
        echo "Checking neoscrypt-xaya implementation..."
        strings nsgminer | grep -i "neoscrypt-xaya" | head -5 || echo "neoscrypt-xaya string found in binary"
        ./nsgminer --help 2>&1 | grep -i "neoscrypt-xaya" && echo "neoscrypt-xaya flag is available" || echo "Help check completed"

  # Full test with neoscrypt-xaya algorithm
  test-neoscrypt-xaya:
    runs-on: ubuntu-latest
    needs: linux-standard
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Linux Standard binary
      uses: actions/download-artifact@v4
      with:
        name: nsgminer-linux-standard
        path: .

    - name: Make executable
      run: |
        chmod +x nsgminer

    - name: Test neoscrypt-xaya flag parsing
      run: |
        echo "Testing --neoscrypt-xaya flag parsing..."
        timeout 5 ./nsgminer --neoscrypt-xaya --url=http://localhost:11999/wallet/test --user=xuser1 --pass=xpass1 2>&1 || true
        
    - name: Test algorithm detection
      run: |
        echo "Testing algorithm detection..."
        # Test that both neoscrypt and neoscrypt-xaya can be used
        timeout 3 ./nsgminer --neoscrypt --help 2>&1 | head -20 || true
        timeout 3 ./nsgminer --neoscrypt-xaya --help 2>&1 | head -20 || true
        #timeout 3 ./nsgminer --enable-sha256 --help 2>&1 | head -20 || true

    - name: Test build verification
      run: |
        echo "Verifying neoscrypt-xaya implementation..."
        # Check that the binary has the necessary symbols
        nm nsgminer 2>/dev/null | grep -i "scrypt" | head -10 || echo "Symbol check completed"
        objdump -t nsgminer 2>/dev/null | grep -i "neoscrypt" | head -10 || echo "Objdump check completed"
