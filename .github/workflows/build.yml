name: Build and Test

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Linux Build - Standard 
  linux-standard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libcurl4-gnutls-dev \
          libjansson-dev \
          libncurses-dev \
          uthash-dev \
          yasm \
          git

    - name: Autogen
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        ./configure --enable-neoscrypt-xaya --without-curses

    - name: Build
      run: |
        make -j$(nproc)

    - name: Verify binary
      run: |
        ls -la nsgminer
        file nsgminer
        ./nsgminer --version 2>&1 || echo "Version check completed"

    - name: Verify neoscrypt-xaya flag
      run: |
        ./nsgminer --help 2>&1 | grep -i "neoscrypt-xaya" || echo "neoscrypt-xaya flag not found in help, checking binary..."
        strings nsgminer | grep -i "neoscrypt-xaya" || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-linux-standard
        path: nsgminer
        retention-days: 7

  # Linux Build - OpenCL
  linux-opencl:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libcurl4-gnutls-dev \
          libjansson-dev \
          libncurses-dev \
          uthash-dev \
          yasm \
          ocl-icd-opencl-dev \
          opencl-headers \
          git

    - name: Autogen
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        ./configure --enable-neoscrypt-xaya --enable-opencl --without-curses

    - name: Build
      run: |
        make -j$(nproc)

    - name: Verify binary
      run: |
        ls -la nsgminer
        file nsgminer

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-linux-opencl
        path: nsgminer
        retention-days: 7

