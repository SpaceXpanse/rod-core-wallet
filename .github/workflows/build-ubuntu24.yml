name: Build Core Wallets
on:
  push:
    branches:
    #  - main
    #  - master
      - dev
      - ubuntu24build
      - '[0-9].[0-9].[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
    #  - main
    #  - master
      - dev
    #  - ubuntu24build
    #  - '[0-9].[0-9].[0-9]+'

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    env:
      APT_BASE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash
    steps:
    # Cache ccache and spacexpanse parameters to speed up subsequent builds
    - uses: actions/cache@v4
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-
    - run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils python3 libminiupnpc-dev libnatpmp-dev libzmq3-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-test-dev libboost-thread-dev
        sudo apt-get install -y libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler libqrencode-dev
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v4
      with:
        path: |
          depends/built
          depends/work/build
          depends/sdk-sources
          depends/x86_64-unknown-linux-gnu          
        key: ${{ runner.os }}-depends-x86_64-unknown-linux-gnu-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-unknown-linux-gnu-
    # Build dependencies using the depends system instead of install_db4.sh
    - run: make -j2 -C depends HOST=x86_64-unknown-linux-gnu
    - run: ./autogen.sh 
    - run: CONFIG_SITE=$PWD/depends/x86_64-unknown-linux-gnu/share/config.site ./configure
    - run: make -j2
    - run: make deploy 
      continue-on-error: true
    - name: Prepare artifacts
      run: |
        mkdir -p deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed $GITHUB_WORKSPACE/src/spacexpanse-cli $GITHUB_WORKSPACE/src/spacexpanse-tx $GITHUB_WORKSPACE/src/spacexpanse-wallet $GITHUB_WORKSPACE/src/spacexpanse-util $GITHUB_WORKSPACE/src/qt/spacexpanse-qt $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-linux64.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh
    - name: Verify build
      run: |
        # Verify binaries are executable
        for binary in spacexpansed spacexpanse-cli spacexpanse-tx spacexpanse-wallet spacexpanse-util; do
          if [ ! -x "$GITHUB_WORKSPACE/deploy/$binary" ]; then
            echo "Error: $binary is not executable"
            exit 1
          fi
        done
        echo "All Linux binaries verified successfully"
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-linux64.zip
    - name: Notify build result
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "Linux build succeeded"
        else
          echo "Linux build failed"
        fi

  windows-build:
    runs-on: ubuntu-24.04
    env:
      APT_BASE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/cache@v4
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-mingw-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-mingw-
    - run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils python3 libminiupnpc-dev libnatpmp-dev libzmq3-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-test-dev libboost-thread-dev
        sudo apt-get install -y libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler libqrencode-dev g++-mingw-w64-x86-64 nsis
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v4
      with:
        path: |
          depends/built
          depends/sdk-sources
          depends/work/build
          depends/x86_64-w64-mingw32          
        key: ${{ runner.os }}-depends-x86_64-w64-mingw32-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-w64-mingw32-
    - run: |
        export LC_ALL=C.UTF-8
        unset CC CXX DISPLAY                 
        PATH=$(echo "$PATH" | sed -e 's/:\/mnt.*//g') # strip out problematic Windows %PATH% imported var
    - run: echo 1 | sudo update-alternatives --config x86_64-w64-mingw32-g++
    # Build dependencies using the depends system instead of install_db4.sh
    - run: make -j2 -C depends HOST=x86_64-w64-mingw32
    - run: ./autogen.sh
    - run: CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site ./configure --prefix=/ --with-gui=yes LDFLAGS=-Wa,-mbig-obj
    - run: make -j2
    - run: make deploy 
      continue-on-error: true
    - name: Prepare artifacts
      run: |
        mkdir -p deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed.exe $GITHUB_WORKSPACE/src/spacexpanse-cli.exe $GITHUB_WORKSPACE/src/spacexpanse-tx.exe $GITHUB_WORKSPACE/src/spacexpanse-wallet.exe $GITHUB_WORKSPACE/src/spacexpanse-util.exe $GITHUB_WORKSPACE/src/qt/spacexpanse-qt.exe $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        # Try to find and copy setup file with wildcard
        cp $GITHUB_WORKSPACE/spacexpanse-*-win64-setup.exe $GITHUB_WORKSPACE/deploy 2>/dev/null || echo "Setup file not found, continuing without it"
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-win64.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh
    - name: Verify build
      run: |
        # Verify binaries are present
        for binary in spacexpansed.exe spacexpanse-cli.exe spacexpanse-tx.exe spacexpanse-wallet.exe spacexpanse-util.exe spacexpanse-qt.exe; do
          if [ ! -f "$GITHUB_WORKSPACE/deploy/$binary" ]; then
            echo "Error: $binary is missing"
            exit 1
          fi
        done
        echo "All Windows binaries verified successfully"
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-win64.zip
    - name: Notify build result
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "Windows build succeeded"
        else
          echo "Windows build failed"
        fi

  macos-build:
    runs-on: macos-14
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/cache@v4
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-
    - name: Install dependencies
      run: |
        brew install automake libtool boost berkeley-db@4 qt@5 protobuf qrencode libevent
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v4
      with:
        path: |
          depends/built
          depends/sdk-sources
          depends/work/build
          depends/x86_64-apple-darwin18          
        key: ${{ runner.os }}-depends-x86_64-apple-darwin-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-apple-darwin-
    # Build dependencies using the depends system
    - run: make -j$(sysctl -n hw.ncpu) -C depends HOST=x86_64-apple-darwin18
    - run: ./autogen.sh
    - name: Configure
      run: |
        CONFIG_SITE=$PWD/depends/x86_64-apple-darwin18/share/config.site ./configure --with-gui=yes
    - run: make -j$(sysctl -n hw.ncpu)
    - run: make deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed $GITHUB_WORKSPACE/src/spacexpanse-cli $GITHUB_WORKSPACE/src/spacexpanse-tx $GITHUB_WORKSPACE/src/spacexpanse-wallet $GITHUB_WORKSPACE/src/spacexpanse-util $GITHUB_WORKSPACE/src/qt/spacexpanse-qt $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        # Try to find and copy DMG file with wildcard
        cp $GITHUB_WORKSPACE/*SpaceXpanse*.dmg $GITHUB_WORKSPACE/deploy 2>/dev/null || echo "DMG file not found, continuing without it"
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-macos.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh
    - name: Verify build
      run: |
        # Verify binaries are executable
        for binary in spacexpansed spacexpanse-cli spacexpanse-tx spacexpanse-wallet spacexpanse-util; do
          if [ ! -x "$GITHUB_WORKSPACE/deploy/$binary" ]; then
            echo "Error: $binary is not executable"
            exit 1
          fi
        done
        echo "All macOS binaries verified successfully"
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-macos.zip
    - name: Notify build result
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "macOS build succeeded"
        else
          echo "macOS build failed"
        fi
