name: Build new core wallets
on:
  push:
    branches:
     - ubuntu24build
     - dev 
     - '[0-9].[0-9].[0-9]+'
    tags:
     - build
     - 'v[0-9].[0-9].[0-9]+'
  pull_request:
    branches:
      - dev
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    env:
      APT_BASE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/cache@v3
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-
    - run: |
        sudo apt-get update
        sudo apt-get upgrade
        sudo apt-get install git build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils python3 libminiupnpc-dev libnatpmp-dev libzmq3-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-test-dev libboost-thread-dev
        sudo apt-get install libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler libqrencode-dev
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v3
      with:
        path: |
          depends/built
          depends/work/build
          depends/sdk-sources
          depends/x86_64-unknown-linux-gnu          
        key: ${{ runner.os }}-depends-x86_64-unknown-linux-gnu-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-unknown-linux-gnu-
    - run: chmod +x ./contrib/install_db4.sh
    - run: ./contrib/install_db4.sh ./       
    - run: ./autogen.sh 
    - run: ./configure BDB_LIBS="-L$GITHUB_WORKSPACE/db4/lib -ldb_cxx-4.8" BDB_CFLAGS="-I$GITHUB_WORKSPACE/db4/include" 
    - run: make -j2
    - run: make deploy 
    - name: Build project # This would actually build your project, using zip for an example artifact
      run: |
        mkdir -p deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed $GITHUB_WORKSPACE/src/spacexpanse-cli $GITHUB_WORKSPACE/src/spacexpanse-tx $GITHUB_WORKSPACE/src/spacexpanse-wallet $GITHUB_WORKSPACE/src/spacexpanse-util $GITHUB_WORKSPACE/src/qt/spacexpanse-qt $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-linux64.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh         
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-linux64.zip

  windows-build:

    runs-on: ubuntu-24.04
    env:
      APT_BASE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/cache@v3
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-mingw-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-mingw-
    - run: |
        sudo apt-get update  
        sudo apt-get upgrade  
        sudo apt-get install git build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils python3 libminiupnpc-dev libnatpmp-dev libzmq3-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-test-dev libboost-thread-dev
        sudo apt-get install libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler libqrencode-dev g++-mingw-w64-x86-64 nsis
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v3
      with:
        path: |
          depends/built
          depends/sdk-sources
          depends/work/build
          depends/x86_64-w64-mingw32          
        key: ${{ runner.os }}-depends-x86_64-w64-mingw32-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-w64-mingw32-
    - run: |
        #chmod +x ./contrib/install_db4.sh
        #./contrib/install_db4.sh ./     
        export LC_ALL=C.UTF-8
        unset CC CXX DISPLAY                 
        PATH=$(echo "$PATH" | sed -e 's/:\/mnt.*//g') # strip out problematic Windows %PATH% imported var
    - run: echo 1 | sudo update-alternatives --config x86_64-w64-mingw32-g++            
    - run: sudo bash -c "echo 0 > /proc/sys/fs/binfmt_misc/status" # Disable WSL support for Win32 applications.
    - run: make -j2 -C depends HOST=x86_64-w64-mingw32
      #working-directory: depends
    - run: ./autogen.sh
    - run: CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site ./configure --prefix=/ --with-gui=yes LDFLAGS=-Wa,-mbig-obj #CFLAGS=$(DEBUG) -Wall -W -Wwrite-strings LDFLAGS= LIBS=  CFLAGS_C=-Wmissing-prototypes CFLAGS_CXX=-std=c++0x BDB_LIBS="-L$GITHUB_WORKSPACE/db4/lib -ldb_cxx-4.8" BDB_CFLAGS="-I$GITHUB_WORKSPACE/db4/include"
    - run: make -j2
    - run: make deploy 
    - run: sudo bash -c "echo 1 > /proc/sys/fs/binfmt_misc/status" # Enable WSL support for Win32 applications. 
    #- run: ls -lh $GITHUB_WORKSPACE
    - name: Build project # This would actually build your project, using zip for an example artifact
      run: |
        mkdir -p deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed.exe $GITHUB_WORKSPACE/src/spacexpanse-cli.exe $GITHUB_WORKSPACE/src/spacexpanse-tx.exe $GITHUB_WORKSPACE/src/spacexpanse-wallet.exe $GITHUB_WORKSPACE/src/spacexpanse-util.exe $GITHUB_WORKSPACE/src/qt/spacexpanse-qt.exe $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        cp $GITHUB_WORKSPACE/spacexpanse-0.6.8.9-win64-setup.exe $GITHUB_WORKSPACE/deploy 
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-win64.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh         
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-win64.zip

  macos-build:

    runs-on: macos-14
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.spacexpanse-params
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/cache@v3
      with:
        path: |
          .ccache
          .spacexpanse-params
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-
    - name: Install dependencies
      run: |
        brew install automake libtool boost berkeley-db@4 qt@5 protobuf qrencode libevent
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.ref_name }}
    - uses: actions/cache@v3
      with:
        path: |
          depends/built
          depends/sdk-sources
          depends/work/build
          depends/x86_64-apple-darwin18          
        key: ${{ runner.os }}-depends-x86_64-apple-darwin-${{ hashFiles('**/configure.ac') }}
        restore-keys: ${{ runner.os }}-depends-x86_64-apple-darwin-
    - run: ./autogen.sh
    - name: Configure
      run: |
        export LDFLAGS="-L/usr/local/opt/berkeley-db@4/lib"
        export CPPFLAGS="-I/usr/local/opt/berkeley-db@4/include"
        ./configure --with-gui=yes
    - run: make -j$(sysctl -n hw.ncpu)
    - run: make deploy
    - name: Build project # This would actually build your project, using zip for an example artifact
      run: |
        mkdir -p deploy
        cp $GITHUB_WORKSPACE/src/spacexpansed $GITHUB_WORKSPACE/src/spacexpanse-cli $GITHUB_WORKSPACE/src/spacexpanse-tx $GITHUB_WORKSPACE/src/spacexpanse-wallet $GITHUB_WORKSPACE/src/spacexpanse-util $GITHUB_WORKSPACE/src/qt/spacexpanse-qt $GITHUB_WORKSPACE/deploy
        strip $GITHUB_WORKSPACE/deploy/*
        cp -r $GITHUB_WORKSPACE/SpaceXpanse-Qt.dmg $GITHUB_WORKSPACE/deploy
        zip -r --junk-paths spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-macos.zip $GITHUB_WORKSPACE/deploy/*
        ls -lh         
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./spacexpanse-${{ github.ref_name }}-${{ github.run_number }}-macos.zip
